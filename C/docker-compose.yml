version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: spendai
      POSTGRES_PASSWORD: spendai
      POSTGRES_DB: spendai
    volumes:
      - spendai_pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://spendai:spendai@db:5432/spendai
    volumes:
      - ./:/app
    ports:
      - 8000:8000
volumes:
  spendai_pgdata:
